<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Monitor | Infrastructure</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .active-period { background-color: #111827 !important; color: white !important; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 font-sans p-8">

    <!-- Config Button -->
    <div class="fixed top-6 right-8">
        <button onclick="toggleConfig()" class="text-xs font-semibold text-gray-400 hover:text-black transition-colors">API Config</button>
    </div>

    <!-- API Config Modal -->
    <div id="configModal" class="hidden fixed inset-0 bg-gray-900/50 backdrop-blur-sm flex items-center justify-center z-50 p-4">
        <div class="bg-white p-6 rounded-xl w-full max-w-sm shadow-xl">
            <h2 class="text-sm font-bold mb-4">Set API Endpoint</h2>
            <input type="text" id="apiUrlInput" class="w-full border border-gray-300 rounded p-2 text-sm mb-4" placeholder="http://localhost:8000">
            <div class="flex justify-end gap-2">
                <button onclick="toggleConfig()" class="px-3 py-1 text-xs font-medium text-gray-500">Cancel</button>
                <button onclick="saveApiUrl()" class="px-3 py-1 text-xs font-medium bg-black text-white rounded">Save</button>
            </div>
        </div>
    </div>

    <div class="max-w-4xl mx-auto">
        <header class="mb-10 flex items-center justify-between">
            <div>
                <h1 class="text-xl font-bold tracking-tight">System Monitor</h1>
                <p class="text-xs text-gray-400 uppercase tracking-widest mt-1">Real-time infrastructure performance</p>
            </div>

            <nav class="flex p-1 bg-white border border-gray-200 rounded-lg shadow-sm">
                <button onclick="updateDashboard(this, 'today')" class="period-btn px-4 py-1.5 text-xs font-medium rounded-md transition-all active-period">Today</button>
                <button onclick="updateDashboard(this, 'week')" class="period-btn px-4 py-1.5 text-xs font-medium rounded-md transition-all text-gray-600 hover:bg-gray-100">Week</button>
                <button onclick="updateDashboard(this, 'month')" class="period-btn px-4 py-1.5 text-xs font-medium rounded-md transition-all text-gray-600 hover:bg-gray-100">Month</button>
            </nav>
        </header>

        <div class="grid grid-cols-1 gap-6">
            <div class="bg-white p-6 rounded-xl border border-gray-100 shadow-sm">
                <h3 class="text-xs font-bold text-gray-400 uppercase mb-4">CPU Usage (%)</h3>
                <div class="h-[180px]"><canvas id="cpuChart"></canvas></div>
            </div>
            <div class="bg-white p-6 rounded-xl border border-gray-100 shadow-sm">
                <h3 class="text-xs font-bold text-gray-400 uppercase mb-4">RAM Usage (%)</h3>
                <div class="h-[180px]"><canvas id="ramChart"></canvas></div>
            </div>
            <div class="bg-white p-6 rounded-xl border border-gray-100 shadow-sm">
                <h3 class="text-xs font-bold text-gray-400 uppercase mb-4">Disk Usage (%)</h3>
                <div class="h-[180px]"><canvas id="diskChart"></canvas></div>
            </div>
        </div>
    </div>

    <script>
        // State
        let API_BASE = localStorage.getItem('api_url') || 'http://localhost:8000';
        document.getElementById('apiUrlInput').value = API_BASE;

        // Chart Initialization
        const createChart = (id, color) => new Chart(document.getElementById(id).getContext('2d'), {
            type: 'line',
            data: { labels: [], datasets: [{ data: [], borderColor: color, tension: 0.4, borderWidth: 2, pointRadius: 0, fill: true, backgroundColor: color + '08' }] },
            options: {
                responsive: true, maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: {
                    y: { beginAtZero: true, max: 100, ticks: { font: { size: 10 } }, grid: { color: '#f9fafb' } },
                    x: { ticks: { font: { size: 10 } }, grid: { display: false } }
                }
            }
        });

        const cpuChart = createChart('cpuChart', '#111827');
        const ramChart = createChart('ramChart', '#4b5563');
        const diskChart = createChart('diskChart', '#9ca3af');

        // Logic
        function toggleConfig() {
            document.getElementById('configModal').classList.toggle('hidden');
        }

        function saveApiUrl() {
            API_BASE = document.getElementById('apiUrlInput').value;
            localStorage.setItem('api_url', API_BASE);
            toggleConfig();
            const active = document.querySelector('.active-period');
            updateDashboard(active, active.innerText.toLowerCase());
        }

        async function updateDashboard(btn, period) {
            document.querySelectorAll('.period-btn').forEach(b => b.classList.remove('active-period'));
            btn.classList.add('active-period');

            try {
                const res = await fetch(`${API_BASE}/data/${period}`);
                const data = await res.json();

                // FIXED: Handle daily format (YYYY-MM-DD) and hourly format (YYYY-MM-DD HH:MM:SS) safely
                const labels = data.labels.map(ts => ts.includes(' ') ? ts.split(' ')[1].substring(0, 5) : ts.substring(5));

                const update = (chart, values) => {
                    chart.data.labels = labels;
                    chart.data.datasets[0].data = values;
                    chart.update();
                };

                update(cpuChart, data.cpu);
                update(ramChart, data.ram);
                update(diskChart, data.disk);
            } catch (err) {
                console.error("Failed to fetch data:", err);
            }
        }

        // Initial Load & Refresh
        updateDashboard(document.querySelector('.period-btn'), 'today');
        setInterval(() => {
            const active = document.querySelector('.active-period');
            updateDashboard(active, active.innerText.toLowerCase());
        }, 60000);
    </script>
</body>
</html>
